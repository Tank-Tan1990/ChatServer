[package]
name = "chat_server"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web 框架
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1.44.2", features = ["full"] }

# WebSocket
tokio-tungstenite = "0.21"
futures-util = "0.3.7"

# 数据库 - 多数据库支持
sqlx = { version = "0.8.1", features = ["runtime-tokio-native-tls", "mysql", "postgres", "sqlite", "any", "chrono"] }

# 达梦数据库驱动 (可选，需要单独配置)
# dm-rs = { version = "0.1", optional = true }

# SQL Server 驱动 (可选)
# tiberius = { version = "0.12", optional = true }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 认证
jsonwebtoken = "9"
bcrypt = "0.15"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
# 密码哈希（参考 Chat-Api / realworld-axum-sqlx 的 Argon2id 方案）
argon2 = "0.5"

# 异步
async-trait = "0.1"

# 日志
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
tracing-appender = "0.2"

# HTTP 中间件
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# 实用工具
chrono = { version = "0.4.20", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
once_cell = "1.0.1"
parking_lot = "0.12"
serde_yaml = "0.9"

# 分布式支持
redis = { version = "0.24", features = ["tokio-comp", "connection-manager", "json"] }
hostname = "0.4"

[dev-dependencies]
